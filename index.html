<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.A.R.K. Uploader</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --border: #2a2a2a;
    --green: #22c55e;
    --orange: #f97316;
    --red: #ef4444;
    --text: #e5e5e5;
    --dim: #888;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
    margin: 0;
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.4rem;
    margin: 8px 0 4px 0;
  }
  .subtitle {
    color: var(--dim);
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--dim);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  input[type="text"] {
    width: 100%;
    background: #1e1e1e;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 0.95rem;
    margin-bottom: 14px;
  }
  .picker-btn {
    width: 100%;
    padding: 16px;
    background: #1e1e1e;
    border: 1px dashed var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 0.95rem;
    text-align: center;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .picker-btn.has-file {
    border-style: solid;
    border-color: var(--green);
    color: var(--green);
  }
  input[type="file"] { display: none; }
  .upload-btn {
    width: 100%;
    padding: 16px;
    background: var(--green);
    border: none;
    border-radius: 10px;
    color: #05170c;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .upload-btn:disabled {
    background: #333;
    color: var(--dim);
  }
  .status-line {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--border);
  }
  .status-line:last-child { border-bottom: none; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--dim);
    flex-shrink: 0;
  }
  .dot.ok { background: var(--green); }
  .dot.warn { background: var(--orange); }
  .dot.err { background: var(--red); }
  #log { display: none; }
  #log.show { display: block; }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--dim);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .tab.active {
    background: var(--green);
    color: #05170c;
    border-color: var(--green);
  }
  .view { display: none; }
  .view.active { display: block; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .card-meta {
    display: flex;
    justify-content: space-between;
    color: var(--dim);
    font-size: 0.75rem;
    margin-bottom: 8px;
  }
  .card-summary {
    font-size: 0.9rem;
    line-height: 1.4;
    margin-bottom: 10px;
  }
  .card-empty {
    color: var(--orange);
    font-size: 0.8rem;
    font-style: italic;
  }
  .card-id {
    font-family: monospace;
    font-size: 0.7rem;
    color: var(--dim);
    cursor: pointer;
  }
  .card-expand-hint {
    color: var(--dim);
    font-size: 0.75rem;
    text-align: center;
    padding-top: 4px;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }
  .field-block {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .field-label {
    font-size: 0.7rem;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .field-text {
    font-size: 0.85rem;
    line-height: 1.4;
    white-space: pre-wrap;
    margin-bottom: 8px;
  }
  .field-actions {
    display: flex;
    gap: 8px;
  }
  .field-btn {
    flex: 1;
    padding: 8px;
    background: #1e1e1e;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.75rem;
    text-align: center;
    cursor: pointer;
  }
  .field-btn.copied {
    background: var(--green);
    color: #05170c;
    border-color: var(--green);
  }
  .reuse-id-btn {
    display: block;
    text-align: center;
    padding: 8px;
    margin-top: 10px;
    background: #1e1e1e;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.75rem;
    color: var(--dim);
    cursor: pointer;
  }
  .refresh-btn {
    width: 100%;
    padding: 12px;
    background: #1e1e1e;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .loading-text {
    color: var(--dim);
    text-align: center;
    padding: 20px;
    font-size: 0.85rem;
  }
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loading-row {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .result-box {
    background: #1e1e1e;
    border-radius: 8px;
    padding: 12px;
    margin-top: 10px;
    font-size: 0.8rem;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--dim);
    max-height: 220px;
    overflow-y: auto;
  }
</style>
</head>
<body>

<h1>M.A.R.K. Uploader</h1>
<div class="subtitle">Pick a video, send it straight to the content engine.</div>

<div class="tabs">
  <div class="tab active" id="tabUpload">Upload</div>
  <div class="tab" id="tabLibrary">Library</div>
</div>

<div class="view active" id="viewUpload">

<div class="panel">
  <label for="endpoint">API Endpoint</label>
  <input type="text" id="endpoint" placeholder="https://mark.sagewire.dev/process-video" value="https://mark.sagewire.dev/process-video">

  <label for="apiKey">API Key</label>
  <input type="text" id="apiKey" placeholder="paste your MARK_API_KEY here">

  <label for="recordId">Record ID (optional — leave blank to create new)</label>
  <input type="text" id="recordId" placeholder="e.g. df1db859">

  <label>Video</label>
  <div class="picker-btn" id="pickerBtn">📹 Tap to choose a video</div>
  <input type="file" id="fileInput" accept="video/*">

  <button class="upload-btn" id="uploadBtn" disabled>Select a video first</button>
</div>

<div class="panel" id="log">
  <div class="status-line"><div class="dot" id="dotUpload"></div><span id="txtUpload">Uploading...</span></div>
  <div class="status-line"><div class="dot" id="dotProcess"></div><span id="txtProcess">Waiting on transcription + LLM...</span></div>
  <div class="status-line"><div class="dot" id="dotSheet"></div><span id="txtSheet">Waiting on Sheets write...</span></div>
  <div class="result-box" id="resultBox"></div>
</div>

</div><!-- /viewUpload -->

<div class="view" id="viewLibrary">
  <button class="refresh-btn" id="refreshBtn">🔄 Refresh Library</button>
  <div id="libraryList"><div class="loading-text">Tap Refresh to load your recent uploads.</div></div>
</div><!-- /viewLibrary -->

<script>
  const pickerBtn = document.getElementById('pickerBtn');
  const fileInput = document.getElementById('fileInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const endpointInput = document.getElementById('endpoint');
  const recordIdInput = document.getElementById('recordId');
  const apiKeyInput = document.getElementById('apiKey');
  const log = document.getElementById('log');
  const resultBox = document.getElementById('resultBox');

  let selectedFile = null;

  pickerBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length > 0) {
      selectedFile = fileInput.files[0];
      pickerBtn.textContent = `✅ ${selectedFile.name}`;
      pickerBtn.classList.add('has-file');
      uploadBtn.disabled = false;
      uploadBtn.textContent = 'Send to M.A.R.K.';
    }
  });

  function setDot(id, state) {
    document.getElementById(id).className = 'dot ' + state;
  }

  uploadBtn.addEventListener('click', async () => {
    const endpoint = endpointInput.value.trim();
    if (!endpoint) {
      alert('Enter the API endpoint first (ask Claude/check your Coolify deployment for the public URL).');
      return;
    }
    if (!apiKeyInput.value.trim()) {
      alert('Enter the API key first -- it\'s the MARK_API_KEY value set in Coolify. Without it every request gets rejected with a 401.');
      return;
    }
    if (!selectedFile) return;

    uploadBtn.disabled = true;
    uploadBtn.textContent = 'Working...';
    log.classList.add('show');
    resultBox.textContent = '';
    setDot('dotUpload', 'warn');
    setDot('dotProcess', '');
    setDot('dotSheet', '');
    document.getElementById('txtUpload').textContent = 'Uploading video...';
    document.getElementById('txtProcess').textContent = 'Waiting on transcription + LLM...';
    document.getElementById('txtSheet').textContent = 'Waiting on Sheets write...';

    const formData = new FormData();
    formData.append('file', selectedFile);
    const recordId = recordIdInput.value.trim();
    if (recordId) formData.append('record_id', recordId);

    // --- DEBUG LOGGING (added 2026-08-04, patched by Claude) ---
    // "Failed to fetch" alone doesn't say WHY -- CORS block, DNS failure,
    // and a proxy timing out the connection all produce that exact same
    // message with zero extra detail. The two things that actually
    // distinguish them are (1) elapsed time before failure, and (2) the
    // real error object's .name/.message, which the old catch block threw
    // away. A live ticking timer + an AbortController with a generous
    // ceiling gives us both: near-instant failure = CORS/DNS/cert issue,
    // long wait then abort = proxy or server timing the request out.
    const startTime = Date.now();
    let elapsedTimer = null;
    const updateElapsed = () => {
      const secs = ((Date.now() - startTime) / 1000).toFixed(1);
      document.getElementById('txtUpload').textContent = `Uploading video... (${secs}s elapsed)`;
    };
    elapsedTimer = setInterval(updateElapsed, 500);

    const controller = new AbortController();
    const timeoutMs = 600000; // 10 minutes -- raised 2026-08-05 after a 2:15 video
    // hit the old 120s ceiling. CPU-based Whisper transcription scales roughly
    // with video length (plus upload time on top), so a fixed short ceiling
    // will always eventually be too small once someone uploads a longer clip.
    // 10 minutes is a rough ceiling, not a measured one -- if a legitimately
    // long video times out at this new limit too, the real fix is showing
    // actual server-side progress (e.g. polling a status endpoint) instead of
    // just raising this number again forever.
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

    try {
      setDot('dotProcess', 'warn');
      document.getElementById('txtProcess').textContent = 'Transcribing + generating content (this can take a bit)...';

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'X-API-Key': apiKeyInput.value.trim() },
        body: formData,
        signal: controller.signal
      });

      clearInterval(elapsedTimer);
      clearTimeout(timeoutId);
      const elapsedSec = ((Date.now() - startTime) / 1000).toFixed(1);

      setDot('dotUpload', 'ok');
      document.getElementById('txtUpload').textContent = `Video uploaded (${elapsedSec}s)`;

      const contentType = res.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) {
        // This is exactly the "<html>...not valid JSON" failure mode
        const raw = await res.text();
        setDot('dotProcess', 'err');
        document.getElementById('txtProcess').textContent = `Server did not return JSON (status ${res.status})`;
        resultBox.textContent = `HTTP ${res.status} ${res.statusText}\n\n${raw.slice(0, 500)}`;
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Try again';
        return;
      }

      const data = await res.json();
      setDot('dotProcess', 'ok');
      document.getElementById('txtProcess').textContent = 'Transcript + content generated';

      if (data.status === 'success') {
        setDot('dotSheet', 'ok');
        document.getElementById('txtSheet').textContent = 'Written to Google Sheet';
      } else if (data.status === 'partial_success') {
        setDot('dotSheet', 'err');
        document.getElementById('txtSheet').textContent = 'Sheet write FAILED (content was generated but not saved)';
      } else {
        setDot('dotSheet', 'warn');
        document.getElementById('txtSheet').textContent = 'Unknown status: ' + data.status;
      }

      resultBox.textContent = JSON.stringify(data, null, 2);
      uploadBtn.disabled = false;
      uploadBtn.textContent = 'Send another';

    } catch (err) {
      clearInterval(elapsedTimer);
      clearTimeout(timeoutId);
      const elapsedSec = ((Date.now() - startTime) / 1000).toFixed(1);

      setDot('dotUpload', 'err');

      if (err.name === 'AbortError') {
        // We hit our own 2-minute ceiling -- the request never got a
        // response at all. This is the timeout signature: long wait,
        // then nothing. Points at a proxy/server timeout, not CORS.
        document.getElementById('txtUpload').textContent = `Timed out after ${elapsedSec}s -- no response from server`;
        resultBox.textContent = `TIMEOUT after ${elapsedSec}s.\n\nThe request was sent but never got a response before hitting this page's own ${timeoutMs/1000}s limit. Two likely causes, in order of likelihood: (1) the video is long enough that upload + CPU-based Whisper transcription genuinely takes longer than this limit -- check Coolify's mark-api logs for a [PIPELINE] line timestamped after this moment to confirm the server kept working; or (2) a reverse proxy in front of the API is killing the connection early. Not a CORS or auth problem either way.`;
      } else {
        // Fast failure (check the elapsed seconds above/below) usually
        // means CORS, DNS, a bad URL, or a TLS/cert problem -- something
        // that fails before any real network round-trip happens.
        document.getElementById('txtUpload').textContent = `Failed after ${elapsedSec}s: ${err.name}`;
        resultBox.textContent = `ERROR after ${elapsedSec}s\n\nName: ${err.name}\nMessage: ${err.message}\n\nIf this failed in well under a second, it's almost always CORS, a DNS/typo issue in the endpoint URL, or a TLS/certificate problem -- not a timeout. If you're testing this on GitHub Pages (https) make sure the API endpoint above also starts with https:// exactly.`;
      }

      uploadBtn.disabled = false;
      uploadBtn.textContent = 'Try again';
    }
  });

  // --- LIBRARY VIEW (added 2026-08-04, patched by Claude) ---
  // WHY THIS EXISTS: the uploader was write-only -- no way to see what
  // MARK has actually produced without opening the Google Sheet directly.
  // This calls the new GET /recent-content endpoint (added the same
  // session) and renders real cards: timestamp, summary, and whether that
  // row's content actually landed (has_content) so a blank/failed row is
  // visible at a glance instead of silently missing.
  const tabUpload = document.getElementById('tabUpload');
  const tabLibrary = document.getElementById('tabLibrary');
  const viewUpload = document.getElementById('viewUpload');
  const viewLibrary = document.getElementById('viewLibrary');
  const refreshBtn = document.getElementById('refreshBtn');
  const libraryList = document.getElementById('libraryList');

  tabUpload.addEventListener('click', () => {
    tabUpload.classList.add('active');
    tabLibrary.classList.remove('active');
    viewUpload.classList.add('active');
    viewLibrary.classList.remove('active');
  });

  tabLibrary.addEventListener('click', () => {
    tabLibrary.classList.add('active');
    tabUpload.classList.remove('active');
    viewLibrary.classList.add('active');
    viewUpload.classList.remove('active');
    if (libraryList.dataset.loaded !== 'true') {
      loadLibrary();
    }
  });

  refreshBtn.addEventListener('click', loadLibrary);

  function deriveRecentContentUrl() {
    // /recent-content lives on the same host as /process-video -- derive
    // it from whatever's in the endpoint field so there's only one URL to
    // configure, not two.
    const base = endpointInput.value.trim().replace(/\/process-video\/?$/, '');
    return base + '/recent-content?limit=20';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  async function loadLibrary() {
    // --- BUG FIX (added 2026-08-04, patched by Claude) ---
    // WHY THIS EXISTS: the original loadLibrary() had a static "Loading..."
    // string with no spinner and, more importantly, no timeout on the
    // fetch() call at all. If /recent-content was slow (a large sheet,
    // gspread being sluggish, a cold container) or the request just hung,
    // there was zero way to tell "still working" from "silently dead" --
    // same class of problem as the original upload button before its
    // debug-logging pass. Fixed the same way: a live elapsed-time spinner,
    // plus an AbortController ceiling so a hang fails visibly instead of
    // spinning forever.
    refreshBtn.disabled = true;
    refreshBtn.textContent = 'Loading...';

    const startTime = Date.now();
    const updateSpinner = () => {
      const secs = ((Date.now() - startTime) / 1000).toFixed(1);
      libraryList.innerHTML = `<div class="loading-row"><span class="spinner"></span>Loading... (${secs}s)</div>`;
    };
    updateSpinner();
    const spinnerTimer = setInterval(updateSpinner, 300);

    const controller = new AbortController();
    const timeoutMs = 20000; // 20s ceiling -- a sheet read should never legitimately take longer
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

    try {
      const res = await fetch(deriveRecentContentUrl(), {
        signal: controller.signal,
        headers: { 'X-API-Key': apiKeyInput.value.trim() }
      });
      clearInterval(spinnerTimer);
      clearTimeout(timeoutId);

      if (!res.ok) {
        libraryList.innerHTML = `<div class="loading-text">Failed to load (HTTP ${res.status}). Is /recent-content deployed yet?</div>`;
        refreshBtn.disabled = false;
        refreshBtn.textContent = '🔄 Refresh Library';
        return;
      }
      const data = await res.json();
      libraryList.dataset.loaded = 'true';

      if (!data.items || data.items.length === 0) {
        libraryList.innerHTML = '<div class="loading-text">Nothing here yet.</div>';
      } else {
        // --- EXPANDABLE CARDS + COPY/SHARE (added 2026-08-04, patched by Claude) ---
        // WHY THIS EXISTS: the first version of the Library only showed a
        // summary preview -- there was no way to actually get the full
        // X_Post or Newsletter text out to post it anywhere. Each card now
        // stores its full content in data-* attributes (escaped, not
        // re-fetched) and expands on tap to show all three fields, each
        // with its own Copy button. Where the phone supports it
        // (navigator.share -- most Android browsers do), a Share button
        // also appears, handing the text straight to the native Android
        // share sheet (X app, Notes, Messages, whatever's installed)
        // instead of a copy-then-paste round trip.
        window._markLibraryItems = data.items;
        libraryList.innerHTML = data.items.map((item, idx) => `
          <div class="card">
            <div class="card-meta">
              <span>${escapeHtml(item.timestamp) || 'no timestamp'}</span>
              <span class="card-id" data-action="copy-id" data-idx="${idx}" title="Tap to reuse this ID">${escapeHtml(item.id)}</span>
            </div>
            ${item.has_content
              ? `<div class="card-summary" data-action="toggle" data-idx="${idx}">${escapeHtml(item.summary)}</div>
                 <div class="card-expand-hint" data-action="toggle" data-idx="${idx}">Tap to expand ▾</div>
                 <div class="field-groups" id="fields-${idx}" style="display:none;"></div>`
              : `<div class="card-empty">⚠ No content generated for this row yet</div>`
            }
          </div>
        `).join('');

        libraryList.querySelectorAll('[data-action="copy-id"]').forEach(el => {
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            recordIdInput.value = el.textContent;
            tabUpload.click();
          });
        });

        libraryList.querySelectorAll('[data-action="toggle"]').forEach(el => {
          el.addEventListener('click', () => {
            const idx = el.dataset.idx;
            const container = document.getElementById(`fields-${idx}`);
            const hint = libraryList.querySelector(`.card-expand-hint[data-idx="${idx}"]`);
            const item = window._markLibraryItems[idx];
            const isOpen = container.style.display !== 'none';

            if (isOpen) {
              container.style.display = 'none';
              hint.textContent = 'Tap to expand ▾';
            } else {
              container.style.display = 'block';
              hint.textContent = 'Tap to collapse ▴';
              if (!container.dataset.built) {
                container.innerHTML = buildFieldBlock('Summary', item.summary)
                  + buildFieldBlock('X Post', item.x_post)
                  + buildFieldBlock('Newsletter', item.newsletter);
                container.dataset.built = 'true';
                wireFieldButtons(container);
              }
            }
          });
        });
      }
    } catch (err) {
      clearInterval(spinnerTimer);
      clearTimeout(timeoutId);
      const elapsedSec = ((Date.now() - startTime) / 1000).toFixed(1);

      if (err.name === 'AbortError') {
        libraryList.innerHTML = `<div class="loading-text">Timed out after ${elapsedSec}s waiting on the server. It may be slow (cold start, large sheet) or /recent-content may not be deployed yet -- try again in a moment.</div>`;
      } else {
        libraryList.innerHTML = `<div class="loading-text">Failed after ${elapsedSec}s: ${escapeHtml(err.message)}</div>`;
      }
    }

    refreshBtn.disabled = false;
    refreshBtn.textContent = '🔄 Refresh Library';
  }

  function buildFieldBlock(label, text) {
    if (!text || !text.trim()) return '';
    // Store the raw text in a data attribute (base64-safe via encodeURIComponent)
    // rather than relying on innerText later, so Copy/Share always get the
    // exact original text even with special characters or line breaks.
    const encoded = encodeURIComponent(text);
    return `
      <div class="field-block">
        <div class="field-label">${escapeHtml(label)}</div>
        <div class="field-text">${escapeHtml(text)}</div>
        <div class="field-actions">
          <div class="field-btn" data-copy="${encoded}">📋 Copy</div>
          ${navigator.share ? `<div class="field-btn" data-share="${encoded}" data-title="${escapeHtml(label)}">📤 Share</div>` : ''}
        </div>
      </div>
    `;
  }

  function wireFieldButtons(container) {
    container.querySelectorAll('[data-copy]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const text = decodeURIComponent(btn.dataset.copy);
        try {
          await navigator.clipboard.writeText(text);
          const original = btn.textContent;
          btn.textContent = '✅ Copied';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = original;
            btn.classList.remove('copied');
          }, 1500);
        } catch (err) {
          alert('Copy failed: ' + err.message);
        }
      });
    });

    container.querySelectorAll('[data-share]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const text = decodeURIComponent(btn.dataset.share);
        try {
          await navigator.share({ title: btn.dataset.title, text: text });
        } catch (err) {
          // User cancelling the share sheet also throws -- don't alert for that.
          if (err.name !== 'AbortError') {
            alert('Share failed: ' + err.message);
          }
        }
      });
    });
  }
</script>

</body>
